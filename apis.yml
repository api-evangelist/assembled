  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-time-off-api-openapi.yml
    type: OpenAPI
  description: >-
    Programmatically create, list, and cancel time-off requests, and pull a stream of time-off updates
    for downstream HRIS or payroll synchronisation. The endpoint underpins the automated time-off and
    shift-swap workflows offered in Assembled's Pro and Enterprise plans.
- aid: assembled:assembled-requirements-api
  name: Assembled Requirements API
  tags:
  - Requirements
  - Coverage
  - Staffing
  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-requirements-api-openapi.yml
    type: OpenAPI
  description: >-
    Create and list staffing requirements that express how many agents are needed by queue, site, team,
    or skill across time intervals. Requirement types describe the family of need (for example, headcount
    vs. occupancy targets). Requirements feed AI scheduling and real-time staffing recommendations.
- aid: assembled:assembled-conversations-api
  name: Assembled Conversations API
  tags:
  - Conversations
  - Channels
  - Customer Interactions
  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-conversations-api-openapi.yml
    type: OpenAPI
  - url: json-schema/assembled-conversation-schema.json
    type: JSONSchema
  description: >-
    Bulk-ingest and bulk-update customer conversation records — phone, email, chat, SMS, social, and back-office
    — so they can be associated with agents, queues, and channels for reporting, QA, and analytics. Used
    by customers running on non-Zendesk/Salesforce stacks or merging multiple CRMs into a unified support
    view.
- aid: assembled:assembled-reports-api
