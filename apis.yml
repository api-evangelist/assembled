apis:
- aid: assembled:assembled-people-api
  name: Assembled People API
  tags:
  - People
  - Agents
  - Roles
  - Workforce Management
  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-people-api-openapi.yml
    type: OpenAPI
  - url: json-schema/assembled-person-schema.json
    type: JSONSchema
  description: >-
    Manage agents (people) in the Assembled workforce. List, retrieve, create, and update agents along
    with their roles, channels, skills, and team assignments. The People API is the entry point for syncing
    agents between Assembled and upstream HRIS, identity, and CRM systems and is the canonical reference
    for who can be scheduled or routed to in Assembled.
- aid: assembled:assembled-agent-state-api
  name: Assembled Agent State API
  tags:
  - Agent State
  - Real-Time
  - Adherence
  tags_raw:
  - Agent State
  - Real-Time
  - Adherence
  - Operations
  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-agent-state-api-openapi.yml
    type: OpenAPI
  description: >-
    Read and write real-time agent state used to drive adherence reporting, live dashboards, and dynamic
    routing. Supports bulk state ingestion from upstream telephony and CRM platforms, a condensed non-overlapping
    timeline view, edit history, and platform-ID associations that link Assembled people to identities
    in Zendesk, Salesforce, Five9, and other integrated systems.
- aid: assembled:assembled-activities-api
  name: Assembled Activities API
  tags:
  - Activities
  - Shifts
  - Scheduling
  - Workforce Management
  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-activities-api-openapi.yml
    type: OpenAPI
  - url: json-schema/assembled-activity-schema.json
    type: JSONSchema
  description: >-
    Create, list, and delete activities — the scheduled shifts, breaks, time off, training, and meetings
    that make up an agent's calendar. Includes bulk creation, soft-delete semantics, and management of
    activity types with their color coding. Companion event_changes endpoint surfaces the audit trail
    for schedule modifications.
- aid: assembled:assembled-forecasts-api
  name: Assembled Forecasts API
  tags:
  - Forecast
  - ML
  - Volume
  - Workforce Planning
  tags_raw:
  - Forecasts
  - ML
  - Volume
  - Workforce Planning
  humanURL: https://docs.assembled.com/
  properties:
  - url: https://docs.assembled.com/
    type: Documentation
  - url: openapi/assembled-forecasts-api-openapi.yml
    type: OpenAPI
  description: >-
    Retrieve Assembled's ML-generated forecasts, forecast totals, manual adjustments, and detected outliers.
    The forecasted-vs-actuals endpoint compares predicted to realised volume so support leaders can tune
    models, identify drift, and validate >90% forecast accuracy claims. Forecasts drive AI-powered schedule
    generation and staffing recommendations across human and AI agents.
- aid: assembled:assembled-time-off-api
